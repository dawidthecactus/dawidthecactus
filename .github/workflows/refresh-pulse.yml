name: Refresh public GitHub metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'  # Mondays, UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public metrics and render SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_pulse.py
      - name: Commit changes if metrics were updated
        run: |
          if ! git diff --quiet -- assets/github-pulse.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github-pulse.svg
            git commit -m "chore(profile): refresh public GitHub pulse"
            git push
          fi
